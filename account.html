<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Protechniks">
    <meta name="description" content="Account Opening Page For TalentHub, a Learning Management Software (LMS) built to educate and train individuals on the Trueminds platform.">
    <title>TalentHub, a subsidiary of the Trueminds Innovations Limited</title>
    <link rel="stylesheet" href="css/account.css">
  </head>

  <body>

    <main class="account">

      <!-- SIDE BAR FOR ACCCOUNT SECTION -->

      <section class="side__details">
        <div class="logo">
          <img src="images/logo/TalentHubLogo1.jpeg" alt="Talent Flow Logo">
          <h1>TalentHub</h1>
        </div>
        <h2>“Learn smarter. Build skills. Track your progress.”</h2>
        <h3>Programming, Design, Development...</h3>
      </section>

       <!--  END OF SIDE BAR FOR ACCCOUNT SECTION -->

       <!-- USER DETAILS SECTION -->

      <section class="user__details">
        <img class="img" src="images/logo/TalentHubLogo1.jpeg" alt="Talent Flow Logo">
         <h1>TalentHub</h1>
        <h2>Create Your Account</h2>
        <h3>Join TalentHub and learn with ease</h3>
        <form action="https://httpbin.org/post" method="post">
          <label for="Name"></label>
          <input
            type="text"
            name="Name"
            id="Name"
            placeholder="Your Name"
            autocomplete="on"
            required>
          <label for="email"></label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Your E-Mail"
            autocomplete="on"
            required>
          <label for="password"></label>
          <input
            class="password"
            type="password"
            name="password"
            id="password"
            placeholder="Your Password"
            required>
          <label for="password"></label>
          <input
            type="password"
            name="password"
            id="confirm__password"
            placeholder="Confirm Password"
            required>
          <button class="button" type="submit">Create Account</button>
        </form>

        <span class="lines">OR</span>
        <p class="socials">
          <img
            src="images/account-images/googleimage.png"
            alt="Google Logo Image"><a href="google.com" target="_blank">Sign up with Google</a>
        </p>
        <p class="socials">
          <img
            src="images/account-images/slackimage.png"
            alt="Slack Logo Image"><a href="slack.com" target="_blank">Sign up with Slack</a>
        </p>
        <h4>
          Already have an account?<a class="Log" href="login.html">Log In</a>
        </h4>
      </section>

       <!-- END OF USER DETAILS SECTION -->
    </main>
  </body>
</html>
