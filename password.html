<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Protechniks">
    <meta name="description" content="Forgotten Password Page For TalentHub, a Learning Management Software (LMS) built to educate and train individuals on the Trueminds platform.">
    <title>TalentHub, a subsidiary of the Trueminds Innovations Limited</title>
    <link rel="stylesheet" href="css/password.css">
  </head>

  <body>
    <main>

       <!-- START OF SIDE BAR -->

      <section class="side__details">
        <div class="logo">
          <img src="./project img/Group (3).png" alt="Talent Flow Logo">
          <h1>TalentHub</h1>
        </div>
        <h2>“Learn smarter. Build skills. Track your progress.”</h2>
        <h3>Programming, Design, Development...</h3>
      </section>

      <!-- END OF SIDE BAR -->


      <!-- START OF USER DETAILS -->

      <section class="user__details">
         <img src="./project img/Group (3).png" alt="Talent Flow Logo">
        <h1>TalentHub</h1>
        <h2>Forgot Password?</h2>
        <h3>Enter E-Mail address to send reset instructions to.</h3>

        <form action="https://httpbin.org/post" method="post">
          <label for="email"></label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Your Reset E-Mail"
            autocomplete="on"
            required>
          <button
            class="button"
            type="submit">
            Reset Password</button>
        </form>
        <h4>Back to<a class="Log" href="login.html">Log In</a></h4>
      </section>

      <!-- END OF USER DETAILS -->
    </main>
  </body>
</html>
