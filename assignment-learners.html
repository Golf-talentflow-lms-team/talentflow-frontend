<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentFlow - New Assignment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assignment.css">
    <link rel="stylesheet" href="assignment-learners.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
 </head>
 <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <button class="sidebar-close" onclick="closeSidebar()">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="sidebar-header">
        <div class="logo"><img src="images/logo.png" alt="logo"> TalentFlow</div>
        <div class="user-info">
          <div class="user-name">Adedokun Daniel</div>
          <div class="user-id">ID: CAR123456</div>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item">
          <span class="menu-icon"><i class="fa-solid fa-dashboard"></i></span>
          <span>Dashboard</span>
        </li>
        <li class="menu-item">
          <span class="menu-icon"><i class="fa-solid fa-search"></i></span>
          <span>Explore</span>
        </li>
        <li class="menu-item">
          <span class="menu-icon"><i class="fa-solid fa-book"></i></span>
          <span>Lessons</span>
        </li>
        <li class="menu-item active">
          <span class="menu-icon"><i class="fa-solid fa-check-circle"></i></span>
          <span>Assignments</span>
          <span class="menu-badge">2</span>
        </li>
        <li class="menu-item">
          <span class="menu-icon"><i class="fa-solid fa-comment"></i></span>
          <span>Discussion</span>
        </li>
        <li class="menu-item">
          <span class="menu-icon"><i class="fa-solid fa-chart-line"></i></span>
          <span>Progress</span>
        </li>
        <li class="menu-item" style="margin-top: auto;">
          <span class="menu-icon"><i class="fa-solid fa-question-circle"></i></span>
          <span>Help</span>
        </li>
        <li class="menu-item">
          <span class="menu-icon"><i class="fa-solid fa-gear"></i></span>
          <span>Settings</span>
        </li>
        <li class="menu-item logout">
          <span class="menu-icon"><i class="fa-solid fa-door-open"></i></span>
          <span>Logout</span>
        </li>
      </ul>
    </aside>
   <!-- Main Content -->
   <main class="main">
      <!-- Header -->
      <div class="header">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="search-box">
          <span><i class="fa-solid fa-search"></i></span>
          <input type="text" placeholder="Search...">
        </div>
       <div class="header-icons">
          <button class="icon-btn"><i class="fa-solid fa-star"></i></button>
          <button class="icon-btn"><i class="fa-solid fa-bell"></i></button>
        </div>
      </div>
      <h1>New Assignment</h1>
     <div class="container">
        <!-- Left Section -->
        <div class="card">
          <label>Assignment Title</label>
          <input type="text" id="title" placeholder="Enter assignment title" />
          <label>Instructions</label>
         <div class="toolbar">
            <button onclick="format('bold')"><b>B</b></button>
            <button onclick="format('italic')"><i>I</i></button>
            <button onclick="format('underline')"><u>U</u></button>
            <button onclick="format('insertUnorderedList')">• List</button>
            <button onclick="addLink()">Link</button>
         </div>
         <div id="editor" contenteditable="true" style="border:1px solid #e0e0e0; padding:10px; border-radius:8px; min-height:120px;"></div>

         <label>Attach Resources</label>
         <div class="upload-box">
            <p>PDF, Images, Links</p>
            <input type="file" id="fileInput" hidden />
            <button class="btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
           <p id="fileName"></p>
         </div>
       </div>
       <!-- Right Section -->
       <div class="card">
          <label>Select Course</label>
          <select id="course">
            <option>UX Foundations</option>
            <option>Web Development</option>
            <option>Data Science</option>
          </select>
         <label>Deadline</label>
         <input type="date" id="date" />
         <input type="time" id="time" />
         <label>Duration (Optional)</label>
          <select id="duration">
           <option>1 Week</option>
           <option selected>2 Weeks</option>
           <option>1 Month</option>
          </select>
         <label>Allow Resubmission
           <label class="switch">
             <input type="checkbox" id="resubmission">
             <span class="slider"></span>
           </label>
         </label>
         <label>Visibility</label>
          <select id="visibility">
            <option value="draft">Draft</option>
            <option value="publish">Publish</option>
          </select>
          <label>Student View
            <label class="switch">
              <input type="checkbox" id="studentView" checked>
              <span class="slider"></span>
            </label>
          </label>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn secondary" onclick="saveDraft()">Save Draft</button>
        <div>
          <button class="btn secondary" onclick="preview()">Preview</button>
          <button class="btn" onclick="publish()">Publish</button>
       </div>
      </div>
    </main>

   <!-- Toast -->
    <div class="toast" id="toast">
      <strong>Assignment Created Successfully!</strong>
      <p id="toastMsg"></p>
    </div>
    <script src="assignment-learners.js"></script>
    <script src="assignment.js"></script>
 </body>
</html>
