<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Protechniks">
    <meta name="description" content="Account Opening Page For TalentHub, a Learning Management Software (LMS) built to educate and train individuals on the Trueminds platform.">
    <title>TalentHub, a subsidiary of the Trueminds Innovations Limited</title>
    <link rel="stylesheet" href="css/account.css">
  </head>

  <body>

    <main class="account">

      <!-- SIDE BAR FOR ACCCOUNT SECTION -->

      <section class="side__details">
        <div class="logo">
          <img src="./project img/Group (3).png" alt="Talent Flow Logo">
          <h1>TalentHub</h1>
        </div>
        <h2>“Learn smarter. Build skills. Track your progress.”</h2>
        <h3>Programming, Design, Development...</h3>
      </section>

       <!--  END OF SIDE BAR FOR ACCCOUNT SECTION -->

       <!-- USER DETAILS SECTION -->

      <section class="user__details">
        <img class="img" src="./project img/Group (3).png" alt="Talent Flow Logo">
         <h1>TalentHub</h1>
        <h2>Create Your Account</h2>
        <h3>Join TalentHub and learn with ease</h3>
        <form onsubmit="register(event)">
          <label for="Name"></label>
          <input
            type="text"
            name="Name"
            id="Name"
            placeholder="Your Name"
            autocomplete="on"
            required>
          <label for="email"></label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Your E-Mail"
            autocomplete="on"
            required>
          <label for="password"></label>
          <input
            class="password"
            type="password"
            name="password"
            id="password"
            placeholder="Your Password"
            required>
          <label for="password"></label>
          <input
            type="password"
            name="password"
            id="confirm__password"
            placeholder="Confirm Password"
            required>


            <label for="role"></label>
         <select name="role" id="administrator" required>
          <option value="" disabled selected hidden>Select Your Role</option>
          <option value="Instructor/Mentor">Instructor/Mentor</option>
          <option value="Learner/Student">Learner/Student</option>
         </select>

         <label for="skill"></label>
         <select class="select" name="skill" id="skill" required>
          <option value="" disabled selected hidden >Select Your Skill</option>
          <option value="Backend Developer">Backend Developer</option>
          <option value="Frontend Developer">Frontend Developer</option>
          <option value="Graphic Designer">Graphic Designer</option>
          <option value="Project Manager">Project Manager</option>   
          <option value="Social Media Manager">Social Media Manager</option>
          <option value="UI/UX Designer">UI/UX Designer</option>
         </select>
         
          <button class="button" type="submit">Create Account</button>
          <p id="message"></p>
        </form>

        <span class="lines">OR</span>
        <p class="socials">
          <img
            src="./images/account-images/googleimage.png"
            alt="Google Logo Image"><a href="google.com" target="_blank">Sign up with Google</a>
        </p>
        <p class="socials">
          <img
            src="./images/account-images/slackimage.png"
            alt="Slack Logo Image"><a href="slack.com" target="_blank">Sign up with Slack</a>
        </p>
        <h4>
          Already have an account?<a class="Log" href="login.html">Log In</a>
        </h4>
      </section>

       <!-- END OF USER DETAILS SECTION -->
        <script>
      function register(event) {
        event.preventDefault();

        const name = document.getElementById("Name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const administrator = document.getElementById("administrator").value;
        const skill = document.getElementById("skill").value;

        fetch("https://talentflow-backend-cakj.onrender.com/api/v1/auth/register", {
          method: "post",
          headers: {
            "Content-Type": "application/json"
          }, 
          body: JSON.stringify({
            name: name, 
            email: email, 
            password: password,
            administrator: administrator,
            skill: skill
          })
        })
        .then(function(response) {
  return response.json().then(data => ({
    status: response.status,
    body: data
  }));
})
.then(function(res) {
  console.log(res);

  if (res.status === 201) {
    window.location.href = "login.html";
  } 
  else if (res.body.detail === "Email already registered") {
    document.getElementById("message").innerText = "Email already exists. Please login.";
  } 
  else {
    document.getElementById("message").innerText = res.body.message || "User already Exit, please Login";
  }
})
        .catch(function(error) {console.error("Error:", error);

        });
      }
    </script>
    </main>
  </body>
</html>
